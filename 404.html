<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>页面没找到｜小白电脑配置生成器</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
      background: #f6f8fc;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .card {
      width: min(100%, 620px);
      border: 1px solid #e2e8f0;
      border-radius: 28px;
      padding: 26px;
      background: #fff;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
    }
    .tag {
      display: inline-flex;
      min-height: 30px;
      align-items: center;
      padding: 0 12px;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 13px;
      font-weight: 950;
    }
    h1 {
      margin: 14px 0 8px;
      font-size: clamp(30px, 6vw, 46px);
      letter-spacing: -0.045em;
      line-height: 1.08;
    }
    p {
      margin: 0 0 18px;
      color: #64748b;
      line-height: 1.75;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    a {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border-radius: 999px;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 950;
    }
    a.secondary {
      background: #eff6ff;
      color: #1d4ed8;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="tag">404</span>
    <h1>这个页面没找到。</h1>
    <p>可能是链接写错了，或者部署时没有把 public 文件夹完整上传。先回生成器或打开自检报告看看。</p>
    <div class="links">
      <a href="./index.html">回生成器</a>
      <a class="secondary" href="./preflight.html">看自检报告</a>
      <a class="secondary" href="./reference.html">看参考表</a>
    </div>
  </main>
</body>
</html>
